<style id="main">
:root{
  --bg:#07090f;
  --bg-elevated:#0d111b;
  --fg:#f7f9fc;
  --hero-sub:#c2cad8;
  --muted:#6b7689;
  --red:#ff2d3f;
  --red-deep:#e30613;
  --red-dark:#9c0009;
  --gold:#ffb627;
  --border-soft:rgba(255,255,255,0.06);
  --font-display:'Outfit','Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);}

.page{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,45,63,0.16) 0%, transparent 55%),
    radial-gradient(80% 50% at 100% 110%, rgba(255,182,39,0.07) 0%, transparent 60%),
    var(--bg);
}

.live-bar{
  height:3px;
  flex-shrink:0;
  position:relative;
  z-index:20;
  background:linear-gradient(90deg, var(--red-dark), var(--red), var(--gold), var(--red), var(--red-dark));
  background-size:200% 100%;
  animation:scan-bar 4s linear infinite;
  box-shadow:0 0 12px rgba(255,45,63,0.5);
}
@keyframes scan-bar{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.bg-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  z-index:0;
  filter:saturate(0.45) brightness(0.75) contrast(1.05);
  pointer-events:none;
}

.video-tint{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(180deg, rgba(7,9,15,0.25) 0%, rgba(7,9,15,0.35) 55%, rgba(7,9,15,0.7) 100%),
    radial-gradient(90% 70% at 50% 0%, rgba(255,45,63,0.10) 0%, transparent 60%);
}

.hero-blur{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(984px,96vw);
  height:527px;
  background:#05060b;
  opacity:0.9;
  filter:blur(82px);
  pointer-events:none;
  z-index:2;
}

.scanlines{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  opacity:0.4;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}

.navbar{
  position:relative;
  z-index:10;
  padding:20px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-badge{
  font-family:var(--font-body);
  font-weight:800;
  font-size:13px;
  letter-spacing:1px;
  color:#fff;
  padding:5px 9px;
  border-radius:6px;
  background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);
  box-shadow:0 0 14px rgba(255,45,63,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
  border:1px solid rgba(255,255,255,0.18);
}

.brand-name{
  font-family:var(--font-body);
  font-weight:700;
  font-size:15px;
  color:var(--fg);
}

.nav{
  display:flex;
  gap:6px;
}

.nav-link{
  background:transparent;
  border:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:8px 14px;
  border-radius:99px;
  font-family:var(--font-body);
  font-weight:500;
  font-size:15px;
  color:rgba(247,249,252,0.9);
  transition:color .2s, background .2s;
}
.nav-link:hover{
  color:#fff;
  background:rgba(255,255,255,0.05);
}
.nav-link:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}

.btn-signup{
  border-radius:99px;
  padding:9px 18px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:14px;
  color:var(--fg);
  cursor:pointer;
  transition:background .2s, transform .2s;
}
.btn-signup:hover{
  background:rgba(255,255,255,0.06);
}
.btn-signup:active{
  transform:scale(0.98);
}
.btn-signup:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}

.nav-divider{
  height:1px;
  margin-top:3px;
  width:100%;
  background:linear-gradient(90deg, transparent, rgba(247,249,252,0.2), transparent);
  position:relative;
  z-index:10;
}

.hero{
  position:relative;
  z-index:10;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

.headline{
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(64px,14vw,220px);
  line-height:1.02;
  letter-spacing:-0.024em;
  color:var(--fg);
  white-space:nowrap;
}

.ai{
  background-image:linear-gradient(to left, var(--red-deep) 0%, var(--red) 45%, var(--gold) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 32px rgba(255,45,63,0.25));
}

.sub{
  font-family:var(--font-body);
  font-weight:400;
  color:var(--hero-sub);
  font-size:18px;
  line-height:32px;
  max-width:28rem;
  margin-top:9px;
  opacity:0.8;
}

.btn-cta{
  border-radius:99px;
  padding:24px 29px;
  margin-top:25px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:16px;
  color:var(--fg);
  cursor:pointer;
  transition:background .25s, transform .25s, box-shadow .25s;
}
.btn-cta:hover{
  background:rgba(255,255,255,0.07);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(255,45,63,0.22);
}
.btn-cta:active{
  transform:translateY(0) scale(0.98);
}
.btn-cta:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}

.trust{
  position:relative;
  z-index:10;
  padding-bottom:40px;
  width:100%;
}

.trust-inner{
  max-width:64rem;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:48px;
  padding:0 32px;
}

.trust-label{
  font-size:14px;
  line-height:1.5;
  color:rgba(247,249,252,0.5);
  font-family:var(--font-body);
  flex-shrink:0;
}

.marquee{
  overflow:hidden;
  flex:1;
  min-width:0;
  -webkit-mask-image:linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
  mask-image:linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
}

.marquee-track{
  display:flex;
  width:max-content;
  animation:marquee 20s linear infinite;
}
@keyframes marquee{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

.marquee-group{
  display:flex;
  align-items:center;
  gap:64px;
  padding-right:64px;
}

.brand-item{
  display:flex;
  align-items:center;
  gap:10px;
  opacity:0.75;
  transition:opacity .2s;
}
.brand-item:hover{
  opacity:1;
}

.brand-icon{
  width:24px;
  height:24px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:12px;
  color:rgba(247,249,252,0.85);
  flex-shrink:0;
}

.brand-item-name{
  font-family:var(--font-display);
  font-weight:600;
  font-size:16px;
  color:var(--fg);
  white-space:nowrap;
}

.liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden;}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

@media (max-width: 1024px){
  .nav{display:none}
}

@media (max-width: 720px){
  .navbar{padding:16px 20px}
  .trust-inner{flex-direction:column; gap:20px; text-align:center;}
  .marquee{width:100%;}
  .sub{padding:0 8px;}
  .btn-cta{padding:18px 24px;}
}
</style>
</head>

<script>
(function(){
  var video = document.querySelector('.bg-video');
  if(!video) return;

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    video.removeAttribute('autoplay');
    video.pause();
    video.remove();
    return;
  }

  var TARGET = 0.5;
  var FADE = 500;
  var hasPlayed = false;
  var fadingOut = false;
  var gen = 0;

  function fade(from, to, done){
    var start = null;
    var myGen = ++gen;
    function step(timestamp){
      if(myGen !== gen) return;
      if(start === null){ start = timestamp; }
      var elapsed = timestamp - start;
      var progress = Math.min(elapsed / FADE, 1);
      video.style.opacity = String(from + (to - from) * progress);
      if(progress < 1){
        requestAnimationFrame(step);
      } else if(done){
        done();
      }
    }
    requestAnimationFrame(step);
  }

  video.addEventListener('playing', function(){
    if(!hasPlayed){
      hasPlayed = true;
      fade(0, TARGET);
    }
  });

  video.addEventListener('timeupdate', function(){
    if(!fadingOut && (video.duration - video.currentTime) <= 0.5){
      fadingOut = true;
      var current = parseFloat(getComputedStyle(video).opacity);
      if(isNaN(current)){ current = TARGET; }
      fade(current, 0);
    }
  });

  video.addEventListener('ended', function(){
    gen++;
    video.style.opacity = '0';
    setTimeout(function(){
      video.currentTime = 0;
      hasPlayed = false;
      fadingOut = false;
      var p = video.play();
      if(p && p.catch){ p.catch(function(){}); }
    }, 100);
  });

  video.addEventListener('error', function(){
    video.remove();
  });
})();
</script>
